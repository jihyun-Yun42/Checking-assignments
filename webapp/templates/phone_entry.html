<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소리튠 과제 체크 알림</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
       max-width:480px;margin:60px auto;padding:0 20px;text-align:center;color:#222}
  h1{font-size:22px}
  p{font-size:15px;line-height:1.6;color:#555}
  input[type=tel]{width:100%;box-sizing:border-box;font-size:20px;padding:14px;
       margin-top:20px;border:1px solid #ccc;border-radius:10px;text-align:center}
  button{display:block;width:100%;margin-top:16px;padding:16px;background:#3C1E1E;
         color:#fff;font-weight:bold;font-size:17px;border:none;border-radius:12px}
  button:disabled{opacity:.6}
  .flash{color:#c0392b;font-weight:bold;font-size:14px}

  /* 확인 중 로딩 오버레이 - 처음 가입하는 번호는 boot.soritune.com에
     실제로 로그인해서 확인하는 과정이 몇 초 걸릴 수 있어서, 그동안
     빈 화면처럼 보이지 않도록 로딩 화면을 띄워둔다. */
  #loading-overlay{
    display:none; position:fixed; inset:0; background:rgba(255,255,255,.96);
    z-index:10; align-items:center; justify-content:center; flex-direction:column;
  }
  #loading-overlay.show{display:flex}
  .spinner{width:40px;height:40px;border:4px solid #eee;border-top-color:#3C1E1E;
           border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading-overlay p{margin-top:16px;font-size:14px;color:#666}
</style>
</head>
<body>
  <h1>소리튠 과제 체크 알림</h1>
  <p>현황판(boot.soritune.com) 로그인에 쓰시는<br>휴대폰 번호를 입력해주세요.<br>
     조장/부조장만 이용할 수 있어요.<br>한 번만 입력하면 다음부터는 이 기기에서
     바로 대시보드로 들어가요.</p>
  {% with messages = get_flashed_messages() %}
    {% if messages %}<p class="flash">{{ messages[0] }}</p>{% endif %}
  {% endwith %}
  <form method="post" id="phone-form">
    <input type="tel" name="phone" placeholder="01012345678" required autofocus>
    <button type="submit" id="submit-btn">시작하기</button>
  </form>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <p>확인 중이에요, 잠시만 기다려주세요...</p>
  </div>

  <script>
    // 제출 중 중복 클릭으로 같은 번호가 여러 번 가입되는 걸 막기 위해,
    // 제출하는 순간 버튼을 비활성화하고 로딩 화면을 띄운다.
    document.getElementById('phone-form').addEventListener('submit', function () {
      document.getElementById('submit-btn').disabled = true;
      document.getElementById('submit-btn').textContent = '확인 중...';
      document.getElementById('loading-overlay').classList.add('show');
    });
  </script>
</body>
</html>
