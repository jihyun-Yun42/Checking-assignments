<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2NCIgaGVpZ2h0PSI2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMwMDAwMDAiLz48dGV4dCB4PSIzMiIgeT0iNDYiIGZvbnQtZmFtaWx5PSItYXBwbGUtc3lzdGVtLEhlbHZldGljYSxBcmlhbCxzYW5zLXNlcmlmIiBmb250LXNpemU9IjM4IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjZmZmZmZmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5KPC90ZXh0Pjwvc3ZnPg==">
<title>하멈말 결과확인</title>
<style>
  html{color-scheme:light}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
       max-width:640px;margin:30px auto;padding:0 20px;color:#222;background:#fff}
  h1{font-size:20px;display:flex;align-items:center;gap:8px}
  .today-badge{font-size:12px;font-weight:bold;color:#0a7a2f;background:#eafaf1;
       border:1px solid #8fd6ab;border-radius:999px;padding:3px 10px}
  .meta{font-size:13px;color:#888;margin-bottom:20px;line-height:1.6}
  .back-link{margin-bottom:6px}
  .back-link a{font-size:13px;color:#888;text-decoration:none}
  .back-link a:hover{text-decoration:underline}
  .team{border:1px solid #e2e2e2;border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .team h2{font-size:16px;margin:0 0 8px}
  .row{font-size:14px;padding:3px 0}
  .row.ok, .row.miss{display:flex;align-items:center;gap:10px;
       border-bottom:1px dashed #eee;padding-bottom:7px;margin-bottom:3px}
  .matched-list .row.ok:last-child, .unmatched-list .row.miss:last-child{
       border-bottom:none;margin-bottom:0}
  .row.ok{color:#0a7a2f}
  .row.miss{color:#888}
  .row.ok > span:first-child, .row.miss > span:first-child{flex:1 1 auto;min-width:0}
  .submit-time{display:inline-block;margin-left:6px;font-size:11px;color:#888;font-weight:normal}
  .err{color:#c0392b;font-weight:bold}

  .amb-card{border:1px solid #f0d9a0;background:#fffaf0;border-radius:10px;
       padding:10px 12px;margin-bottom:10px}
  .amb-raw-label{font-size:13px;color:#8a6100;margin-bottom:6px;line-height:1.4}
  .amb-candidate-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
       padding:6px 0;border-top:1px solid #f5e6c4;flex-wrap:wrap}
  .amb-candidate-row:first-of-type{border-top:none}
  label.cand{display:flex;align-items:center;gap:6px;font-size:14px;padding:0;margin:0;flex:1 1 auto}
  .section-title{font-size:12px;color:#999;margin-top:10px;text-transform:uppercase}
  .toolbar{position:sticky;bottom:0;background:#fff;padding:14px 0;border-top:1px solid #eee;margin-top:10px}
  .toolbar label{font-size:14px}
  button{width:100%;padding:16px;background:#3C1E1E;color:#fff;font-weight:bold;
         font-size:16px;border:none;border-radius:12px;margin-top:10px}
  button:disabled{background:#ccc;color:#888;cursor:default}
  .warn{background:#fff6e5;border:1px solid #f0c36d;color:#8a6100;border-radius:10px;
        padding:12px 14px;font-size:14px;line-height:1.5;margin-bottom:16px}
  .applied{background:#eafaf1;border:1px solid #8fd6ab;color:#0a7a2f;border-radius:10px;
        padding:12px 14px;font-size:14px;line-height:1.5;margin-bottom:16px}
  .test-note{font-size:13px;color:#888;text-align:center;margin-top:8px}

  .exclude-btn{flex-shrink:0;border:none;border-left:1px solid #eee;background:none;
       background-color:transparent;-webkit-appearance:none;appearance:none;
       border-radius:0;outline:none;color:#bbb;
       font-size:16px;line-height:1;font-weight:bold;padding:4px 2px 4px 12px;
       cursor:pointer;margin:0;width:auto;display:inline-flex;align-items:center;
       justify-content:center}
  .exclude-btn:hover{color:#c0392b}
  .exclude-btn:disabled{color:#ddd;cursor:default}

  .mark-submitted-btn{flex-shrink:0;border:none;background:none;background-color:transparent;
       -webkit-appearance:none;appearance:none;border-radius:0;outline:none;color:#bbb;
       font-size:16px;line-height:1;font-weight:bold;padding:4px 2px;
       cursor:pointer;margin:0;width:auto;display:inline-flex;align-items:center;
       justify-content:center}
  .mark-submitted-btn:hover{color:#0a7a2f}
  .mark-submitted-btn:disabled{color:#ddd;cursor:default}

  .row-actions{display:flex;align-items:center;gap:2px;flex-shrink:0;
       border-left:1px solid #eee;padding-left:10px}

  .fixname-trigger{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;
       text-decoration-color:#ccc}
  .fixname-trigger:hover{color:#8a5a00;text-decoration-color:#8a5a00}

  #fixname-search{width:100%;padding:10px;font-size:15px;margin-bottom:10px;
       border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
  .fixname-list{height:260px;overflow-y:auto;border:1px solid #eee;border-radius:8px;
       margin-bottom:4px;box-sizing:border-box}
  .fixname-item{padding:11px 12px;font-size:14px;cursor:pointer;border-bottom:1px solid #f2f2f2;
       display:flex;align-items:center;justify-content:space-between;gap:8px}
  .fixname-item:last-child{border-bottom:none}
  .fixname-item:hover{background:#f8f5ee}
  .unmatched-tag{color:#999;font-size:12px;flex-shrink:0}
  .fixname-item.fixname-item-manual{color:#8a5a00;font-weight:bold}
  .fixname-item.fixname-item-empty{color:#999;cursor:default;
       justify-content:center;text-align:center;line-height:1.5}
  .fixname-item.fixname-item-empty:hover{background:none}

  .matched-raw{color:#999;font-size:12px;cursor:pointer;text-decoration:underline dotted;
       text-underline-offset:2px;margin-left:4px}
  .matched-raw:hover{color:#8a5a00}
  .override-hint{color:#999;font-size:12px;margin-left:4px}

  .amb-manual-trigger{font-size:12px;color:#8a5a00;cursor:pointer;text-decoration:underline;
       flex-shrink:0;white-space:nowrap}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;
       align-items:center;justify-content:center;padding:20px;z-index:100}
  .modal-overlay[hidden]{display:none}
  .modal-box{background:#fff;border-radius:14px;padding:20px;max-width:420px;width:100%;
       max-height:80vh;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.2);position:relative}
  .modal-close-x{position:absolute;top:10px;right:10px;width:30px;height:30px;border:none;
       background:none;color:#999;font-size:16px;line-height:1;cursor:pointer;border-radius:50%;
       display:flex;align-items:center;justify-content:center;padding:0;margin:0}
  .modal-close-x:hover{background:#f2f2f2;color:#333}
  .modal-title{font-size:16px;font-weight:bold;margin:0 0 8px;color:#222}
  .modal-desc{font-size:13px;color:#666;line-height:1.5;margin:0 0 14px}
  .confirm-list{font-size:13px;color:#333;margin-bottom:16px}
  .confirm-list .team-name{font-weight:bold;margin-top:14px;display:block}
  .confirm-list .team-name:first-child{margin-top:0}
  .confirm-list .name-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .confirm-list .name-chip{background:#f5f5f5;border-radius:6px;padding:4px 9px;
       font-size:12px;color:#333;line-height:1.4}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px}
  .modal-btn{border:none;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:bold;cursor:pointer;width:auto;margin:0}
  .modal-btn-cancel{background:#eee;color:#333}
  .modal-btn-save{background:#3C1E1E;color:#fff}
  #info-modal-desc{white-space:pre-line}

  .review-skeleton{padding:4px 0}
  .skeleton-line,.skeleton-card{background:linear-gradient(90deg,#eee 25%,#f5f5f5 37%,#eee 63%);
       background-size:400% 100%;animation:skeleton-shimmer 1.4s ease infinite;border-radius:8px}
  .skeleton-line{height:16px;margin-bottom:10px;width:40%}
  .skeleton-line.skeleton-title{height:22px;width:55%;margin-bottom:16px}
  .skeleton-card{height:54px;margin-bottom:10px;border-radius:12px}
  @keyframes skeleton-shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
</style>
</head>
<body>
  <div class="review-skeleton" id="review-skeleton">
    <div class="skeleton-line skeleton-title"></div>
    <div class="skeleton-line" style="width:60%"></div>
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
    <div class="skeleton-card" style="width:70%"></div>
  </div>

  <div id="review-content" hidden></div>

  <script>

    window.__initReviewScripts = function (ctx) {
      var CONFIRM_MATCH_URL = ctx.confirm_match_url;
      var UNCONFIRM_MATCH_URL = ctx.unconfirm_match_url;
      var FIX_NAME_URL = ctx.fix_name_url;
      var TOGGLE_SUBMISSION_URL = ctx.toggle_submission_url;
      var CHAT_SENDERS = ctx.chat_senders;
      var MATCHED_RAW_NAMES = ctx.matched_raw_names;
      var APPLIED = ctx.applied;
      var APPLIED_MATCHED_IDS = ctx.applied_matched_ids;
      var APPLIED_HAD_SNAPSHOT = ctx.applied_had_snapshot;
      // 한 번도 반영한 적 없어도, 서버가 소리튠 조장페이지를 직접 조회해서
      // 지금 화면이랑 이미 똑같다고 확인해준 경우 true. 이 경우 페이지가 처음
      // 뜬 시점의 제출자 목록을 기준선으로 삼아서(아래 liveBaselineMatchedSet),
      // 스냅샷이 있는 경우와 똑같은 방식으로 "달라진 게 있는지"를 계속 추적한다.
      var LIVE_ALREADY_APPLIED = ctx.live_already_applied;
      var form = document.getElementById('review-form');
      var submitBtn = form.querySelector('button[type="submit"]');
      var modal = document.getElementById('confirm-apply-modal');
      var listEl = document.getElementById('confirm-list');
      var okBtn = document.getElementById('confirm-apply-ok');
      var cancelBtn = document.getElementById('confirm-apply-cancel');

      // 서버가 처음부터 비활성화해둔 상태(테스트 모드 꺼짐 / 이미 반영됨)는 그대로
      // 지켜야 하므로, 확인필요 체크 처리 중 잠깐 막는 것과 구분해서 관리한다.
      var baseSubmitDisabled = submitBtn.disabled;
      var baseSubmitText = submitBtn.textContent;
      var pendingConfirmCount = 0;

      function updateSubmitButtonState() {
        var noDelta = false;
        var hasBaseline = (APPLIED && APPLIED_HAD_SNAPSHOT) ||
          (!APPLIED && !APPLIED_HAD_SNAPSHOT && LIVE_ALREADY_APPLIED);
        if (hasBaseline && typeof computeApplyDelta === 'function') {
          var delta = computeApplyDelta();
          noDelta = delta.added.length === 0 && delta.removed.length === 0;
        }
        submitBtn.disabled = baseSubmitDisabled || pendingConfirmCount > 0 || noDelta;
        submitBtn.textContent = pendingConfirmCount > 0 ? '저장 중…' : baseSubmitText;
      }

      function escapeHtml(s) {
        var div = document.createElement('div');
        div.textContent = s == null ? '' : s;
        return div.innerHTML;
      }

      // ---------- 알림 팝업 (window.alert() 대체) ----------
      var infoModal = document.getElementById('info-modal');
      var infoModalDesc = document.getElementById('info-modal-desc');
      var infoModalOk = document.getElementById('info-modal-ok');

      var infoModalReloadOnClose = false;
      function showInfoModal(message, reloadOnClose) {
        infoModalDesc.textContent = message == null ? '' : message;
        infoModal.hidden = false;
        infoModalReloadOnClose = !!reloadOnClose;
      }
      function closeInfoModal() {
        infoModal.hidden = true;
        if (infoModalReloadOnClose) {
          infoModalReloadOnClose = false;
          location.reload();
        }
      }
      infoModalOk.addEventListener('click', closeInfoModal);
      document.getElementById('info-modal-close').addEventListener('click', closeInfoModal);
      infoModal.addEventListener('click', function (e) {
        if (e.target === infoModal) closeInfoModal();
      });

      function bumpCount(teamEl, selector, delta) {
        var el = teamEl.querySelector(selector);
        if (!el) return null;
        var next = Math.max(0, parseInt(el.textContent, 10) + delta);
        el.textContent = String(next);
        return next;
      }

      // ---------- 제출 안 함으로 변경(미제출로 이동) 확인 팝업 ----------
      // confirm() 팝업은 쓰지 않고 우리가 만든 모달로 대체한다. "우리 조원
      // 아님"이 아니라 "실제로 제출하지 않았다"는 뜻으로 바꾸고, 지우기만
      // 하는 게 아니라 미제출 목록에 다시 보이도록 옮긴다.
      var excludeModal = document.getElementById('exclude-modal');
      var excludeModalDesc = document.getElementById('exclude-modal-desc');
      var excludeOkBtn = document.getElementById('exclude-ok');
      var excludeCancelBtn = document.getElementById('exclude-cancel');
      var excludePendingAction = null;

      function openExcludeModal(display, onConfirm) {
        excludeModalDesc.textContent =
          (display ? display + ' 님, ' : '') + '실제로는 제출하지 않았나요?\n확인하면 미제출 명단으로 다시 옮겨요.';
        excludePendingAction = onConfirm;
        excludeModal.hidden = false;
      }
      function closeExcludeModal() {
        excludeModal.hidden = true;
        excludePendingAction = null;
      }
      excludeOkBtn.addEventListener('click', function () {
        var action = excludePendingAction;
        closeExcludeModal();
        if (action) action();
      });
      excludeCancelBtn.addEventListener('click', closeExcludeModal);
      document.getElementById('exclude-close').addEventListener('click', closeExcludeModal);
      excludeModal.addEventListener('click', function (e) {
        if (e.target === excludeModal) closeExcludeModal();
      });

      function excludeMatchedMember(team, memberId, display, nickname, realName, row, teamEl) {
        openExcludeModal(display, function () {
          row.style.opacity = '.5';
          fetch(TOGGLE_SUBMISSION_URL, {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ team: team, member_id: memberId, direction: 'exclude' }),
          })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              if (!data.ok) {
                showInfoModal(data.error || '저장하지 못했습니다.');
                row.style.opacity = '';
                return;
              }
              row.remove();
              bumpCount(teamEl, '.matched-count', -1);
              addUnmatchedRow(teamEl, team, memberId, nickname, realName, display, data.known_raw);
            })
            .catch(function () {
              showInfoModal('네트워크 오류로 저장하지 못했습니다.');
              row.style.opacity = '';
            });
        });
      }

      function wireStaticExcludeButtons() {
        document.querySelectorAll('.matched-list .exclude-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var team = btn.getAttribute('data-team');
            var memberId = btn.getAttribute('data-member-id');
            var nickname = btn.getAttribute('data-nickname') || '';
            var realName = btn.getAttribute('data-real-name') || '';
            var display = btn.getAttribute('data-display') || '';
            var row = btn.closest('.row.ok');
            var teamEl = btn.closest('.team');
            excludeMatchedMember(team, memberId, display, nickname, realName, row, teamEl);
          });
        });
      }
      wireStaticExcludeButtons();

      // 미제출 목록에서 쓰던 행 하나를 통째로 제거한다 (이름 고치기 / 확인필요
      // 선택 / 사실 제출했어요, 어느 경로로 제출자로 옮겨지든 공통으로 쓴다).
      function removeUnmatchedRow(teamEl, memberId) {
        var row = teamEl.querySelector('.unmatched-list .row.miss[data-member-id="' + memberId + '"]');
        if (!row) return;
        row.remove();
        bumpCount(teamEl, '.unmatched-count', -1);
        var emptyMissEl = teamEl.querySelector('.unmatched-empty');
        if (emptyMissEl) emptyMissEl.remove();
      }

      // 제출자 → "실제로 제출 안 함"으로 되돌릴 때, 미제출 목록에 행을 새로
      // 만들어 붙인다. 이름 고치기 / 사실 제출했어요를 다시 쓸 수 있게 그대로
      // wiring 해준다.
      function addUnmatchedRow(teamEl, team, memberId, nickname, realName, display, hintText) {
        var unmatchedList = teamEl.querySelector('.unmatched-list');
        var row = document.createElement('div');
        row.className = 'row miss';
        row.setAttribute('data-member-id', memberId);

        var trigger = document.createElement('span');
        trigger.className = 'fixname-trigger';
        trigger.setAttribute('role', 'button');
        trigger.setAttribute('tabindex', '0');
        trigger.title = '카카오톡 이름이 달라요 (눌러서 수정)';
        trigger.setAttribute('data-mode', 'unmatched');
        trigger.setAttribute('data-team', team);
        trigger.setAttribute('data-member-id', memberId);
        trigger.setAttribute('data-nickname', nickname || '');
        trigger.setAttribute('data-real-name', realName || '');
        trigger.setAttribute('data-display', display);
        trigger.appendChild(document.createTextNode(display));
        var tag = document.createElement('span');
        trigger.appendChild(document.createTextNode(' '));
        if (hintText) {
          tag.className = 'override-hint';
          tag.textContent = '· ' + hintText;
        } else {
          tag.className = 'unmatched-tag';
          tag.textContent = '(매칭안됨)';
        }
        trigger.appendChild(tag);
        wireOneFixnameTrigger(trigger);
        row.appendChild(trigger);

        var actions = document.createElement('span');
        actions.className = 'row-actions';
        var markBtn = document.createElement('button');
        markBtn.type = 'button';
        markBtn.className = 'mark-submitted-btn';
        markBtn.title = '사실 제출했어요';
        markBtn.setAttribute('aria-label', '사실 제출했어요');
        markBtn.textContent = '✓';
        markBtn.setAttribute('data-team', team);
        markBtn.setAttribute('data-member-id', memberId);
        markBtn.setAttribute('data-nickname', nickname || '');
        markBtn.setAttribute('data-real-name', realName || '');
        markBtn.setAttribute('data-display', display);
        markBtn.addEventListener('click', function () { moveUnmatchedToMatched(markBtn); });
        actions.appendChild(markBtn);
        row.appendChild(actions);

        unmatchedList.appendChild(row);
        bumpCount(teamEl, '.unmatched-count', 1);
        var emptyEl = teamEl.querySelector('.unmatched-empty');
        if (emptyEl) emptyEl.remove();
        updateSubmitButtonState();
        return row;
      }

      // 제출자 목록에 새 행을 만들어 붙인다. rawText가 있으면 그 아래에 작은
      // 회색 글씨로 보여주고, 눌러서 다시 고칠 수 있게 fixname-trigger로 만든다.
      function addMatchedRow(teamEl, team, memberId, display, rawText) {
        var matchedList = teamEl.querySelector('.matched-list');
        var row = document.createElement('div');
        row.className = 'row ok';
        row.setAttribute('data-member-id', memberId);

        var span = document.createElement('span');
        span.appendChild(document.createTextNode('✅ ' + display));
        if (rawText) {
          span.appendChild(document.createTextNode(' '));
          var rawSpan = document.createElement('span');
          rawSpan.className = 'matched-raw fixname-trigger';
          rawSpan.setAttribute('role', 'button');
          rawSpan.setAttribute('tabindex', '0');
          rawSpan.title = '카카오톡 이름이 달라요 (눌러서 수정)';
          rawSpan.setAttribute('data-mode', 'matched');
          rawSpan.setAttribute('data-team', team);
          rawSpan.setAttribute('data-member-id', memberId);
          rawSpan.setAttribute('data-nickname', '');
          rawSpan.setAttribute('data-real-name', '');
          rawSpan.setAttribute('data-display', display);
          rawSpan.textContent = '· ' + rawText;
          wireOneFixnameTrigger(rawSpan);
          span.appendChild(rawSpan);
        }
        row.appendChild(span);

        var excludeBtn = document.createElement('button');
        excludeBtn.type = 'button';
        excludeBtn.className = 'exclude-btn';
        excludeBtn.textContent = '✕';
        excludeBtn.title = '실제로 제출 안 함 (눌러서 미제출로 변경)';
        excludeBtn.setAttribute('aria-label', '실제로 제출 안 함');
        excludeBtn.addEventListener('click', function () {
          excludeMatchedMember(team, memberId, display, '', '', row, teamEl);
        });
        row.appendChild(excludeBtn);

        matchedList.appendChild(row);
        bumpCount(teamEl, '.matched-count', 1);
        var emptyEl = teamEl.querySelector('.matched-empty');
        if (emptyEl) emptyEl.remove();
        updateSubmitButtonState();
        return row;
      }

      function moveUnmatchedToMatched(btn) {
        var team = btn.getAttribute('data-team');
        var memberId = btn.getAttribute('data-member-id');
        var nickname = btn.getAttribute('data-nickname') || '';
        var realName = btn.getAttribute('data-real-name') || '';
        var display = btn.getAttribute('data-display') ||
          (nickname + ' (' + realName + ')');
        var teamEl = btn.closest('.team');

        btn.disabled = true;
        fetch(TOGGLE_SUBMISSION_URL, {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            team: team, member_id: memberId, direction: 'include', nickname: nickname, real_name: realName,
          }),
        })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (!data.ok) {
              showInfoModal(data.error || '저장하지 못했습니다.');
              btn.disabled = false;
              return;
            }
            removeUnmatchedRow(teamEl, memberId);
            addMatchedRow(teamEl, team, memberId, display, data.known_raw || null);
          })
          .catch(function () {
            showInfoModal('네트워크 오류로 저장하지 못했습니다.');
            btn.disabled = false;
          });
      }

      function wireMarkSubmittedButtons() {
        document.querySelectorAll('.unmatched-list .mark-submitted-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            moveUnmatchedToMatched(btn);
          });
        });
      }
      wireMarkSubmittedButtons();

      // ---------- 이름 고치기 팝업 ----------

      var fixnameModal = document.getElementById('fixname-modal');
      var fixnameSearch = document.getElementById('fixname-search');
      var fixnameList = document.getElementById('fixname-list');
      var fixnameCancel = document.getElementById('fixname-cancel');
      var fixnameTarget = null; // { mode, team, memberId, nickname, realName, display, row, teamEl }

      // "(5회)"/"(5회차)"처럼 매주 바뀌는 회차 번호만 떼고 비교하기 위한 함수.
      // 이름 고치기 검색 목록에서, 회차만 다를 뿐 사실은 이미 이번 날짜에
      // 매칭된 사람을 "(매칭안됨)"으로 잘못 표시하지 않기 위해 쓴다.
      function stripRoundSuffix(s) {
        return (s || '').replace(/\(\s*\d+\s*회?\s*차?\s*\)\s*$/, '').trim();
      }

      var matchedRawSet = {};
      MATCHED_RAW_NAMES.forEach(function (n) {
        matchedRawSet[n] = true;
        matchedRawSet[stripRoundSuffix(n)] = true;
      });
      function isAlreadyMatchedRaw(name) {
        return !!(matchedRawSet[name] || matchedRawSet[stripRoundSuffix(name)]);
      }

      function closeFixnameModal() {
        fixnameModal.hidden = true;
        fixnameTarget = null;
      }

      // 초성(ㅇ, ㅈ 등)만 입력해도, 또는 글자+초성을 섞어 입력해도 찾을 수
      // 있게 하는 한글 자모 느슨한 검색. "ㅇ" → 초성이 ㅇ인 모든 글자에 매치,
      // "윤ㅈ" → "윤" 다음에 초성이 ㅈ인 글자가 바로 이어지면 매치.
      var CHOSUNG_LIST = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

      function hangulChosung(ch) {
        var code = ch.charCodeAt(0) - 0xAC00;
        if (code < 0 || code > 11171) return null;
        return CHOSUNG_LIST[Math.floor(code / 588)];
      }

      function charMatches(queryChar, targetChar) {
        if (!targetChar) return false;
        if (queryChar.toLowerCase() === targetChar.toLowerCase()) return true;
        if (CHOSUNG_LIST.indexOf(queryChar) !== -1) {
          return hangulChosung(targetChar) === queryChar;
        }
        return false;
      }

      function fuzzyKoreanIncludes(target, query) {
        if (!query) return true;
        target = target || '';
        for (var start = 0; start <= target.length - query.length; start++) {
          var ok = true;
          for (var i = 0; i < query.length; i++) {
            if (!charMatches(query[i], target[start + i])) { ok = false; break; }
          }
          if (ok) return true;
        }
        return false;
      }

      function renderFixnameList() {
        var q = fixnameSearch.value.trim();
        var matches = CHAT_SENDERS.filter(function (name) {
          return fuzzyKoreanIncludes(name, q);
        });

        fixnameList.innerHTML = '';
        matches.forEach(function (name) {
          var item = document.createElement('div');
          item.className = 'fixname-item';

          var nameSpan = document.createElement('span');
          nameSpan.textContent = name;
          item.appendChild(nameSpan);

          if (!isAlreadyMatchedRaw(name)) {
            var tag = document.createElement('span');
            tag.className = 'unmatched-tag';
            tag.textContent = '(매칭안됨)';
            item.appendChild(tag);
          }

          item.addEventListener('click', function () { submitFixName(name); });
          fixnameList.appendChild(item);
        });

        if (q && CHAT_SENDERS.indexOf(q) === -1) {
          var manual = document.createElement('div');
          manual.className = 'fixname-item fixname-item-manual';
          manual.textContent = '"' + q + '" (으)로 직접 입력해서 저장';
          manual.addEventListener('click', function () { submitFixName(q); });
          fixnameList.appendChild(manual);
        }

        if (matches.length === 0 && !q) {
          var empty = document.createElement('div');
          empty.className = 'fixname-item fixname-item-empty';
          empty.textContent = '이 날짜의 참가자 목록을 찾지 못했어요. 위 검색창에 이름을 입력해서 직접 저장할 수 있어요.';
          fixnameList.appendChild(empty);
        }
      }

      function openFixnameModal(trigger) {
        var mode = trigger.getAttribute('data-mode') || 'unmatched';
        fixnameTarget = {
          mode: mode,
          team: trigger.getAttribute('data-team'),
          memberId: trigger.getAttribute('data-member-id'),
          nickname: trigger.getAttribute('data-nickname'),
          realName: trigger.getAttribute('data-real-name'),
          display: trigger.getAttribute('data-display'),
          teamEl: trigger.closest('.team'),
          ambCandidateRow: trigger.closest('.amb-candidate-row'),
          ambCard: trigger.closest('.amb-card'),
        };
        fixnameSearch.value = '';
        renderFixnameList();
        fixnameModal.hidden = false;
        fixnameSearch.focus();
      }

      function wireOneFixnameTrigger(trigger) {
        trigger.addEventListener('click', function () { openFixnameModal(trigger); });
        trigger.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openFixnameModal(trigger);
          }
        });
      }

      function wireFixNameButtons() {
        document.querySelectorAll('.fixname-trigger').forEach(wireOneFixnameTrigger);
      }
      wireFixNameButtons();

      fixnameSearch.addEventListener('input', renderFixnameList);
      fixnameCancel.addEventListener('click', closeFixnameModal);
      document.getElementById('fixname-close').addEventListener('click', closeFixnameModal);
      fixnameModal.addEventListener('click', function (e) {
        if (e.target === fixnameModal) closeFixnameModal();
      });

      // fixedDates: 서버가 돌려준 "같이 고쳐진 날짜들". includesToday가 true면
      // 배열 맨 앞이 오늘 날짜라서 그걸 빼고 "다른 날짜"만 센다.
      function announceFixedDates(display, newName, fixedDates, includesToday) {
        var others = includesToday ? (fixedDates || []).slice(1) : (fixedDates || []).slice();
        if (others.length === 0) return;
        showInfoModal(
          display + ' → ' + newName + '\n\n' +
          '이미 올라온 파일에 있던 다른 날짜(' + others.length + '개)의 미제출도 ' +
          '같이 "' + newName + '"으로 고쳐서 제출 완료로 바꿨어요.\n(' + others.join(', ') + ')'
        );
      }

      // 확인필요 카드에서 후보 한 줄을 뗀다 — 그 줄이 그 카드의 마지막
      // 후보였으면 카드(그리고 다 떨어지면 섹션까지)도 같이 치운다. 확인필요
      // 후보가 아닌 트리거(이름 고치기 등)에서는 ambCandidateRow/ambCard가
      // 애초에 없어서 아무 일도 하지 않는다.
      function removeAmbCandidateRow(target) {
        if (target.ambCandidateRow) target.ambCandidateRow.remove();
        if (target.ambCard && !target.ambCard.querySelector('.amb-candidate-row')) {
          target.ambCard.remove();
          var ambLeft = bumpCount(target.teamEl, '.amb-count', -1);
          if (ambLeft === 0) {
            var ambSection = target.teamEl.querySelector('.amb-section');
            if (ambSection) ambSection.remove();
          }
        }
      }

      function submitFixName(rawNewName) {
        if (!fixnameTarget) return;
        var target = fixnameTarget;
        var newName = rawNewName.trim();
        if (!newName) return;

        fixnameList.style.pointerEvents = 'none';
        fixnameList.style.opacity = '.5';

        fetch(FIX_NAME_URL, {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ team: target.team, member_id: target.memberId, display_name: newName }),
        })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (!data.ok) {
              showInfoModal(data.error || '저장하지 못했습니다.');
              return;
            }

            closeFixnameModal();

            var teamEl = target.teamEl;
            var team = target.team, memberId = target.memberId;
            var display = target.display || target.nickname + ' (' + target.realName + ')';

            if (target.mode === 'matched') {
              // 이미 제출자였던 사람의 카카오 이름을 고친 경우 — 고친 이름으로
              // 이 날짜에 실제로 보낸 메시지가 있는지 다시 확인한다.
              if (data.matched) {
                var rawSpan = teamEl.querySelector(
                  '.matched-list .row.ok[data-member-id="' + memberId + '"] .matched-raw'
                );
                if (rawSpan) rawSpan.textContent = '· ' + (data.member && data.member._matched_raw ? data.member._matched_raw : newName);
                announceFixedDates(display, newName, data.fixed_dates || [], false);
              } else {
                // 고친 이름으로는 이 날짜에 보낸 메시지를 찾지 못함 — 지금까지의
                // 매칭이 잘못됐던 것이므로 미제출로 내려간다.
                var matchedRow = teamEl.querySelector('.matched-list .row.ok[data-member-id="' + memberId + '"]');
                if (matchedRow) matchedRow.remove();
                bumpCount(teamEl, '.matched-count', -1);
                addUnmatchedRow(teamEl, team, memberId, target.nickname, target.realName, display, newName);
                var demoteMsg =
                  display + '\n\n"' + newName + '"(으)로 이름을 등록했어요. 다음 업로드부터는 자동으로 매칭돼요.\n' +
                  '다만 이 날짜 대화에서는 그 이름으로 보낸 메시지를 찾지 못해서, 이 날짜는 미제출로 바뀌었어요.';
                if (data.fixed_dates && data.fixed_dates.length > 0) {
                  demoteMsg += '\n\n다른 날짜(' + data.fixed_dates.length + '개)는 그 이름으로 보낸 메시지를 찾아서 ' +
                    '제출 완료로 바꿨어요.\n(' + data.fixed_dates.join(', ') + ')';
                }
                showInfoModal(demoteMsg);
              }
              return;
            }

            // 미제출 또는 확인필요 후보였던 사람 — 둘 다 원래 미제출 목록에도
            // 같이 들어있으므로, 확인필요 카드에 있었으면 그 후보 줄도 치운다.
            removeAmbCandidateRow(target);

            if (!data.matched) {
              // 이름은 등록됐지만, 이 날짜 대화에서는 그 이름으로 보낸 메시지를
              // 찾지 못해서 아직 미제출 상태 — 미제출 목록의 표시만 갱신한다.
              var row = teamEl.querySelector('.unmatched-list .row.miss[data-member-id="' + memberId + '"]');
              if (row) {
                var tagEl = row.querySelector('.unmatched-tag');
                if (tagEl) {
                  tagEl.className = 'override-hint';
                  tagEl.textContent = '· ' + newName;
                } else {
                  var hintEl = row.querySelector('.override-hint');
                  if (hintEl) hintEl.textContent = '· ' + newName;
                }
              }
              showInfoModal(
                display + '\n\n"' + newName + '"(으)로 이름을 등록했어요. 다음 업로드부터는 자동으로 매칭돼요.\n' +
                '다만 이 날짜 대화에서는 그 이름으로 보낸 제출 메시지를 찾지 못해서, 이 날짜는 아직 미제출로 남아있어요.'
              );
              return;
            }

            // 미제출 → 제출자로 이동
            removeUnmatchedRow(teamEl, memberId);
            addMatchedRow(teamEl, team, memberId, display, data.member && data.member._matched_raw ? data.member._matched_raw : newName);
            announceFixedDates(display, newName, data.fixed_dates || [], true);
          })
          .catch(function () {
            showInfoModal('네트워크 오류로 저장하지 못했습니다.');
          })
          .finally(function () {
            fixnameList.style.pointerEvents = '';
            fixnameList.style.opacity = '';
          });
      }

      // ---------- 확인필요: "맞으면 체크" 시 카드를 치우는 공통 함수 ----------
      function removeAmbBlockIfDone(teamEl, ambBlock) {
        if (ambBlock) ambBlock.remove();
        var ambLeft = bumpCount(teamEl, '.amb-count', -1);
        if (ambLeft === 0) {
          var ambSection = teamEl.querySelector('.amb-section');
          if (ambSection) ambSection.remove();
        }
      }

      // ---------- 확인필요 체크박스 ----------

      document.querySelectorAll('.amb-checkbox').forEach(function (cb) {
        cb.addEventListener('change', function () {
          if (!cb.checked) return;

          var team = cb.getAttribute('data-team');
          var memberId = cb.getAttribute('data-member-id');
          var nickname = cb.getAttribute('data-nickname');
          var realName = cb.getAttribute('data-real-name');
          var display = cb.getAttribute('data-display') || (nickname + ' (' + realName + ')');
          var raw = cb.getAttribute('data-raw');
          var teamEl = cb.closest('.team');
          var ambBlock = cb.closest('.amb-card');

          // 시트에 저장되기 전에 "반영하기"를 눌러버리면 아직 matched-list로
          // 옮겨지지 않은 사람이 반영확인 팝업 명단에서 누락될 수 있으므로,
          // 저장이 끝날 때까지 반영 버튼을 잠깐 막아둔다.
          pendingConfirmCount += 1;
          updateSubmitButtonState();

          fetch(CONFIRM_MATCH_URL, {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              team: team, member_id: memberId, nickname: nickname, real_name: realName, raw: raw,
            }),
          })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              if (!data.ok) {
                showInfoModal(data.error || '시트에 저장하지 못했습니다.');
                cb.checked = false;
                return;
              }

              // 체크박스가 들어있던 확인필요 블록은 곧 통째로 사라지므로, 새
              // 행을 만들기 전에 체크박스를 먼저 떼서 남겨둔다 — 다만 이제는
              // confirm-match가 미제출 목록에서도 바로 지워주므로 새로 만든
              // 행에 체크박스를 다시 붙여둘 필요는 없다.
              removeUnmatchedRow(teamEl, memberId);
              addMatchedRow(teamEl, team, memberId, display, raw);
              removeAmbBlockIfDone(teamEl, ambBlock);
              announceFixedDates(display, raw, data.fixed_dates || [], false);
            })
            .catch(function () {
              showInfoModal('네트워크 오류로 시트에 저장하지 못했습니다.');
              cb.checked = false;
            })
            .finally(function () {
              pendingConfirmCount = Math.max(0, pendingConfirmCount - 1);
              updateSubmitButtonState();
            });
        });
      });

      // ---------- 반영하기 ----------

      // 마지막으로 반영했을 때의 제출자 id 스냅샷(서버가 내려줌). 반영 이후에
      // 이름 고치기/미제출 전환 등으로 바뀐 사람만 "재반영" 확인 팝업에 보여주기
      // 위해, 지금 화면 상태와 이 스냅샷을 비교한다.
      var appliedMatchedSet = {};
      APPLIED_MATCHED_IDS.forEach(function (id) { appliedMatchedSet[String(id)] = true; });

      function currentMatchedMap() {
        var map = {};
        document.querySelectorAll('.matched-list .row.ok').forEach(function (row) {
          var id = row.getAttribute('data-member-id');
          var span = row.querySelector('span');
          var text = span ? span.textContent.replace('✅', '').trim() : '';
          var parts = text.split(' · ');
          map[id] = (parts.length > 1 ? parts[1] : parts[0]).trim();
        });
        return map;
      }

      // 반영한 적은 없지만(스냅샷 없음) 서버가 라이브로 이미 일치한다고 확인해준
      // 경우, 페이지가 뜬 시점의 제출자 목록을 기준선으로 삼는다 — 그 뒤로
      // 제출/미제출을 바꾸면 이 기준선과 비교해서 "달라진 사람"만 추적할 수 있다.
      var liveBaselineMatchedSet = {};
      if (!APPLIED_HAD_SNAPSHOT && LIVE_ALREADY_APPLIED) {
        Object.keys(currentMatchedMap()).forEach(function (id) { liveBaselineMatchedSet[id] = true; });
      }

      function unmatchedDisplayFor(id) {
        var row = document.querySelector('.unmatched-list .row.miss[data-member-id="' + id + '"]');
        if (!row) return '#' + id;
        var trigger = row.querySelector('.fixname-trigger');
        var text = trigger && trigger.childNodes[0] ? trigger.childNodes[0].textContent : '';
        return text.trim() || ('#' + id);
      }

      function computeApplyDelta() {
        var current = currentMatchedMap();
        var added = [];
        var removed = [];
        var baseline = APPLIED_HAD_SNAPSHOT ? appliedMatchedSet :
          (LIVE_ALREADY_APPLIED ? liveBaselineMatchedSet : null);
        if (!baseline) {
          // 비교할 기준이 아예 없는 경우(최초 반영이고, 소리튠 쪽 라이브 확인도
          // 못 했거나 지금 화면이랑 다른 경우) — 뭐가 바뀌었는지 정확히 알 수
          // 없으니 지금 제출자 전체를 다시 체크하고 지금 미제출자 전체를 체크
          // 해제하는 전체 재동기화로 보여준다.
          Object.keys(current).forEach(function (id) {
            added.push({ id: id, display: current[id] });
          });
          document.querySelectorAll('.unmatched-list .row.miss').forEach(function (row) {
            var id = row.getAttribute('data-member-id');
            removed.push({ id: id, display: unmatchedDisplayFor(id) });
          });
          return { added: added, removed: removed };
        }
        Object.keys(current).forEach(function (id) {
          if (!baseline[id]) added.push({ id: id, display: current[id] });
        });
        Object.keys(baseline).forEach(function (id) {
          if (!current[id]) removed.push({ id: id, display: unmatchedDisplayFor(id) });
        });
        return { added: added, removed: removed };
      }

      function buildSummary() {
        if (!APPLIED) {
          var html = '';
          var total = 0;
          document.querySelectorAll('.team').forEach(function (teamEl) {
            var teamName = teamEl.getAttribute('data-team');
            var names = [];
            teamEl.querySelectorAll('.matched-list .row.ok').forEach(function (row) {
              var span = row.querySelector('span');
              var text = span ? span.textContent.replace('✅', '').trim() : '';
              var parts = text.split(' · ');
              names.push((parts.length > 1 ? parts[1] : parts[0]).trim());
            });
            if (names.length === 0) return;
            total += names.length;
            html += '<span class="team-name">' + escapeHtml(teamName) + ' (' + names.length + '명)</span>';
            html += '<div class="name-chips">' + names.map(function (n) {
              return '<span class="name-chip">' + escapeHtml(n) + '</span>';
            }).join('') + '</div>';
          });
          if (total === 0) html = '반영될 인원이 없습니다.';
          return html;
        }

        var delta = computeApplyDelta();
        if (APPLIED_HAD_SNAPSHOT && delta.added.length === 0 && delta.removed.length === 0) {
          return '마지막 반영 이후로 바뀐 내용이 없어요.';
        }
        var html = '';
        if (delta.added.length) {
          html += '<span class="team-name">새로 반영될 사람 (' + delta.added.length + '명)</span>';
          html += '<div class="name-chips">' + delta.added.map(function (p) {
            return '<span class="name-chip">' + escapeHtml(p.display) + '</span>';
          }).join('') + '</div>';
        }
        if (delta.removed.length) {
          html += '<span class="team-name">반영 취소될 사람 (' + delta.removed.length + '명)</span>';
          html += '<div class="name-chips">' + delta.removed.map(function (p) {
            return '<span class="name-chip">' + escapeHtml(p.display) + '</span>';
          }).join('') + '</div>';
        }
        return html;
      }

      form.addEventListener('submit', function (e) {
        // 바뀐 내용이 없을 때는 버튼 자체가 비활성화돼 있으므로(updateSubmitButtonState),
        // 여기까지 올 일이 없다 — 혹시 모를 경우를 대비한 안전장치만 남긴다.
        if (submitBtn.disabled) return;
        e.preventDefault();
        listEl.innerHTML = buildSummary();
        modal.hidden = false;
      });

      // 반영이 끝난 뒤, 그 다음부터 "달라진 사람만 다시 반영" 비교 기준이
      // 될 수 있도록 맨 위 "✅ ... 기준 반영됐어요" 안내문을 새로고침 없이
      // 바로 만들거나 갱신한다.
      function markAppliedBanner(appliedAtText) {
        var html = '✅ ' + escapeHtml(appliedAtText || '방금') + ' 기준 반영됐어요.<br>' +
          '제출/미제출 변경 시 X표시나 체크(✓)표시를 누른 후 반영하기 버튼을 눌러주세요.';
        var appliedP = document.querySelector('p.applied');
        if (appliedP) {
          appliedP.innerHTML = html;
        } else {
          appliedP = document.createElement('p');
          appliedP.className = 'applied';
          appliedP.innerHTML = html;
          form.parentNode.insertBefore(appliedP, form);
        }
      }

      okBtn.addEventListener('click', function () {
        modal.hidden = true;
        submitBtn.disabled = true;
        submitBtn.textContent = '반영 중…';
        fetch(form.action, { method: 'POST', credentials: 'same-origin' })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (!data.ok) {
              showInfoModal(data.error || '반영하지 못했습니다.');
              updateSubmitButtonState();
              return;
            }
            var lines = Object.keys(data.results || {}).map(function (t) {
              return data.results[t];
            });
            // 새로고침하지 않고, 지금 화면을 바로 "반영됨" 상태로 바꾼다 —
            // 다음 비교 기준(appliedMatchedSet)도 지금 화면의 제출자 명단으로
            // 맞춰둬야 그 다음부터 또 바뀐 사람만 추적할 수 있다.
            APPLIED = true;
            APPLIED_HAD_SNAPSHOT = true;
            appliedMatchedSet = {};
            Object.keys(currentMatchedMap()).forEach(function (id) { appliedMatchedSet[id] = true; });
            markAppliedBanner(data.applied_at);
            updateSubmitButtonState();
            showInfoModal(lines.join('\n') || '반영됐어요.');
          })
          .catch(function () {
            showInfoModal('네트워크 오류로 반영하지 못했습니다.');
            updateSubmitButtonState();
          });
      });
      cancelBtn.addEventListener('click', function () {
        modal.hidden = true;
      });
      document.getElementById('confirm-apply-close').addEventListener('click', function () {
        modal.hidden = true;
      });
      modal.addEventListener('click', function (e) {
        if (e.target === modal) modal.hidden = true;
      });

      updateSubmitButtonState();
    };
  
    (function () {
      var CONTENT_URL = {{ content_url | tojson }};
      var skeleton = document.getElementById('review-skeleton');
      var content = document.getElementById('review-content');

      fetch(CONTENT_URL, { credentials: 'same-origin' })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (!data.ok) {
            throw new Error(data.error || '결과를 불러오지 못했습니다.');
          }
          content.innerHTML = data.html;
          skeleton.hidden = true;
          content.hidden = false;
          window.__initReviewScripts(data.ctx);
        })
        .catch(function (err) {
          skeleton.innerHTML =
            '<p style="color:#888;font-size:14px;padding:20px 0">' +
            (err && err.message ? err.message : '결과를 불러오지 못했습니다. 새로고침 해주세요.') +
            '</p>';
        });
    })();
  </script>
</body>
</html>
