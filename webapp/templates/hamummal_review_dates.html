<title>하멈말 결과확인</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
       max-width:480px;margin:40px auto;padding:0 20px;color:#222}
  h1{font-size:19px}
  .date-list{margin-top:16px}
  .date-link{display:flex;align-items:center;justify-content:space-between;gap:8px;
       padding:12px 14px;border:1px solid #eee;border-radius:10px;margin-bottom:8px;
       text-decoration:none;color:#222;font-size:14px;font-weight:bold}
  .date-link:hover{border-color:#3C1E1E}
  .today-badge{font-size:11px;font-weight:bold;color:#0a7a2f;background:#eafaf1;
       border:1px solid #8fd6ab;border-radius:999px;padding:2px 8px}
  .empty{font-size:14px;color:#888;margin-top:20px}
</style>
</head>
<body>
  <h1>📮 하멈말 결과확인</h1>
  {% if dates %}
    <div class="date-list">
      {% for row in dates %}
        <a class="date-link" href="{{ url_for('hamummal_review', review_id=row.id) }}">
          <span>{{ row.check_date }}</span>
          {% if row.check_date == today_str %}<span class="today-badge">오늘</span>{% endif %}
        </a>
      {% endfor %}
    </div>
  {% else %}
    <p class="empty">아직 업로드된 결과가 없어요.</p>
  {% endif %}
</body>
</html>
