<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2NCIgaGVpZ2h0PSI2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMwMDAwMDAiLz48dGV4dCB4PSIzMiIgeT0iNDYiIGZvbnQtZmFtaWx5PSItYXBwbGUtc3lzdGVtLEhlbHZldGljYSxBcmlhbCxzYW5zLXNlcmlmIiBmb250LXNpemU9IjM4IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjZmZmZmZmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5KPC90ZXh0Pjwvc3ZnPg==">
<title>조원 이름 일괄 매칭</title>
<style>
  html{color-scheme:light}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
       max-width:560px;margin:40px auto;padding:0 20px;color:#222;background:#fff}
  h1{font-size:19px;margin:0 0 4px}
  .back-link{margin-bottom:6px}
  .back-link a{font-size:13px;color:#888;text-decoration:none}
  .back-link a:hover{text-decoration:underline}
  .desc{font-size:13px;color:#666;line-height:1.5;margin:8px 0 16px}

  .input-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:4px}
  #bulk-match-input{flex:1 1 auto;min-width:0;box-sizing:border-box;padding:10px;font-size:14px;
       border:1px solid #ddd;border-radius:8px;font-family:inherit;resize:none;
       background:#fff;color:#222}
  #bulk-match-run{flex-shrink:0;width:auto;margin:0;border:none;border-radius:8px;
       background:#3C1E1E;color:#fff;font-weight:bold;font-size:14px;padding:12px 16px;
       cursor:pointer;white-space:nowrap}
  #bulk-match-run:disabled{background:#ccc;color:#888;cursor:default}

  .section-divider{border:none;border-top:1px solid #eee;margin:22px 0 14px}
  .board-title{font-size:15px;font-weight:bold;margin:0 0 4px}

  .bulk-section{margin-top:4px}
  .bulk-section-title{font-size:12px;color:#999;margin-top:16px;margin-bottom:6px;
       text-transform:uppercase}
  .bulk-row{font-size:13px;padding:8px 10px;border:1px solid #eee;border-radius:8px;
       margin-bottom:6px;line-height:1.5}
  .bulk-row.amb{border-color:#f0d9a0;background:#fffaf0}
  .bulk-row.resolved{background:#f3faf3;border-color:#cfe9cf}
  .bulk-sub{font-size:12px;color:#888;margin-top:4px}
  .bulk-sub.resolved-note{color:#0a7a2f;font-weight:bold}
  .bulk-candidates{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .bulk-cand-btn{border:1px solid #d8c48a;background:#fff;color:#8a6100;border-radius:999px;
       padding:5px 11px;font-size:12px;cursor:pointer;width:auto;margin:0}
  .bulk-cand-btn:hover{background:#fdf3dd}
  .bulk-cand-btn:disabled{opacity:.5;cursor:default}
  .bulk-empty{font-size:13px;color:#888;margin-top:14px}
  .bulk-row.no-match{background:#fafafa;cursor:pointer}
  .bulk-row.no-match:hover{border-color:#d8c48a}
  .bulk-nomatch-trigger{font-weight:bold}
  .bulk-roster-picker{max-height:160px;overflow-y:auto}

  #bulk-roster-status{margin-top:10px}
  .bulk-status-row{display:flex;flex-direction:column;gap:5px;font-size:13px;padding:9px 0;
       border-bottom:1px dashed #f0f0f0}
  .bulk-status-row:last-child{border-bottom:none}
  .bulk-status-row .nm{min-width:0}
  .bulk-status-row .auto-tag{font-size:10px;color:#0a7a2f;background:#eafaf1;
       border-radius:999px;padding:1px 6px;margin-left:4px}
  .bulk-status-controls{display:flex;align-items:center;gap:6px}
  .bulk-status-input{flex:1 1 auto;min-width:0;padding:7px 8px;font-size:13px;
       border:1px solid #ddd;border-radius:6px;font-family:inherit;
       background:#fff;color:#222}
  .bulk-status-save-btn{border:1px solid #d8c48a;background:#fff;color:#8a6100;border-radius:999px;
       padding:7px 12px;font-size:12px;cursor:pointer;width:auto;margin:0;flex-shrink:0}
  .bulk-status-save-btn:hover{background:#fdf3dd}
  .bulk-status-save-btn:disabled{opacity:.5;cursor:default}

  /* 데스크탑(넓은 화면)에서는 이름 - 입력칸 - 버튼을 한 줄에, 모바일(좁은
     화면)에서는 이름을 윗줄에 따로 두고 입력칸+버튼을 아랫줄에 배치한다. */
  @media (min-width:520px){
    .bulk-status-row{flex-direction:row;align-items:center;gap:8px}
    .bulk-status-row .nm{flex:0 1 auto}
    .bulk-status-controls{flex:1 1 auto}
  }

  .input-wrap{position:relative}
  #bulk-toast{display:none;position:absolute;left:0;right:0;top:100%;margin-top:6px;z-index:5;
       background:#FBF3EA;color:#3C1E1E;font-size:13px;font-weight:bold;border:1px solid #E8DFD0;
       padding:10px 14px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  #bulk-toast.show{display:block}
</style>
</head>
<body>
  <p class="back-link"><a href="{{ url_for('hamummal_review_dates') }}">← 날짜 목록</a></p>
  <h1>🔗 조원 이름 일괄 매칭</h1>
  <p class="desc">카카오톡 소통방 참가자 명단을 쉼표(,)나 줄바꿈으로 구분해서 붙여넣으면,
    아직 한 번도 메시지를 보낸 적 없는 조원도 미리 이름을 매칭해둬요.
    다음부터 그 이름으로 메시지를 보내면 자동으로 제출자로 잡혀요.</p>

  <div class="input-wrap">
    <div class="input-row">
      <textarea id="bulk-match-input" rows="4" placeholder="윤지현_Jenna, 박성수_Charlie, 이종길_Aaron&#10;또는 한 줄에 한 명씩"></textarea>
      <button type="button" id="bulk-match-run">매칭하기</button>
    </div>
    <div id="bulk-toast"></div>
  </div>

  <div id="bulk-match-results"></div>

  <hr class="section-divider">
  <p class="board-title">조원 매칭 현황</p>
  <div id="bulk-roster-status"></div>

  <script>
    (function () {
      var TEAM = {{ team | tojson }};
      var BULK_MATCH_URL = {{ url_for('hamummal_review_bulk_match_names') | tojson }};
      var BULK_RESOLVE_URL = {{ url_for('hamummal_review_bulk_match_resolve') | tojson }};
      var ROSTER_STATUS_URL = {{ url_for('hamummal_review_roster_status') | tojson }};

      var runBtn = document.getElementById('bulk-match-run');
      var input = document.getElementById('bulk-match-input');
      var resultsEl = document.getElementById('bulk-match-results');
      var statusEl = document.getElementById('bulk-roster-status');
      var toastEl = document.getElementById('bulk-toast');

      function escapeHtml(s) {
        var div = document.createElement('div');
        div.textContent = s == null ? '' : s;
        return div.innerHTML;
      }

      var toastTimer = null;
      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove('show');
        }, 3200);
      }

      function fixedDatesSuffix(fixedDates) {
        if (fixedDates && fixedDates.length) {
          return ' · 지난 ' + fixedDates.length + '개 날짜 제출도 같이 반영됨';
        }
        return '';
      }

      // ---------- 이번 매칭 실행 결과(확인 필요 / 매칭 안 됨) ----------

      // 매칭이 끝난 뒤에도 카드 자체는 지우지 않고 남겨서(누구로 매칭됐는지
      // 계속 보이게) "resolved" 표시만 하고, 그 섹션 제목 옆의 (n명/n건) 숫자는
      // 아직 안 끝난 카드 수만 세어서 다시 그려준다.
      function refreshSectionCount(sectionEl) {
        if (!sectionEl) return;
        var countEl = sectionEl.querySelector('.bulk-section-count');
        if (!countEl) return;
        var remaining = sectionEl.querySelectorAll('.bulk-row:not(.resolved)').length;
        countEl.textContent = remaining;
      }

      function wireCandidateButtons() {
        resultsEl.querySelectorAll('.bulk-cand-btn').forEach(function (btn) {
          if (btn.dataset.wired) return;
          btn.dataset.wired = '1';
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            var memberId = btn.getAttribute('data-member-id');
            var raw = btn.getAttribute('data-raw');
            var matchedDisplay = btn.textContent;
            var row = btn.closest('.bulk-row');
            row.querySelectorAll('.bulk-cand-btn').forEach(function (b) { b.disabled = true; });

            fetch(BULK_RESOLVE_URL, {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ team: TEAM, member_id: memberId, raw: raw }),
            })
              .then(function (res) { return res.json(); })
              .then(function (d) {
                if (!d.ok) {
                  var errNote = document.createElement('div');
                  errNote.className = 'bulk-sub';
                  errNote.textContent = d.error || '매칭하지 못했어요.';
                  row.appendChild(errNote);
                  row.querySelectorAll('.bulk-cand-btn').forEach(function (b) { b.disabled = false; });
                  return;
                }
                // 후보 버튼은 다시 누르면 고칠 수 있도록 계속 활성화 상태로
                // 두고(no-match 카드의 선택 패널 자체도 유지해서 다시 열어
                // 재선택할 수 있게 한다), 안내문만 "매칭 완료" 메모로 바꿔서
                // 누구로 매칭됐는지 보여준다.
                row.querySelectorAll('.bulk-cand-btn').forEach(function (b) { b.disabled = false; });
                var instructionEl = row.querySelector('.bulk-sub:not(.resolved-note)');
                if (instructionEl) instructionEl.remove();
                var note = row.querySelector('.bulk-sub.resolved-note');
                if (!note) {
                  note = document.createElement('div');
                  note.className = 'bulk-sub resolved-note';
                  row.appendChild(note);
                }
                note.textContent = '✅ ' + matchedDisplay + '(으)로 매칭 완료' +
                  fixedDatesSuffix(d.fixed_dates) + (row.classList.contains('no-match') ? ' · 눌러서 수정' : '');
                var wasResolved = row.classList.contains('resolved');
                row.classList.add('resolved');
                if (!wasResolved) refreshSectionCount(row.closest('.bulk-section'));
                loadRosterStatus();
              })
              .catch(function () {
                row.querySelectorAll('.bulk-cand-btn').forEach(function (b) { b.disabled = false; });
              });
          });
        });
      }

      function wireNoMatchTriggers() {
        resultsEl.querySelectorAll('.bulk-row.no-match').forEach(function (row) {
          if (row.dataset.wired) return;
          row.dataset.wired = '1';
          var toggle = function (e) {
            if (e && e.target && e.target.closest('.bulk-cand-btn')) return;
            var picker = row.querySelector('.bulk-roster-picker');
            if (!picker) return;
            if (!picker.hidden) { picker.hidden = true; return; }
            if (!picker.childElementCount) {
              var raw = row.getAttribute('data-raw');
              picker.innerHTML = lastRoster.map(function (m) {
                return '<button type="button" class="bulk-cand-btn" data-member-id="' + m.member_id +
                  '" data-raw="' + escapeHtml(raw) + '">' + escapeHtml(m.display) + '</button>';
              }).join('');
              wireCandidateButtons();
            }
            picker.hidden = false;
          };
          row.setAttribute('role', 'button');
          row.setAttribute('tabindex', '0');
          row.addEventListener('click', toggle);
          row.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(e); }
          });
        });
      }

      var lastRoster = [];

      function renderResults(data) {
        lastRoster = data.roster || [];
        var html = '';
        if (data.no_match && data.no_match.length) {
          html += '<div class="bulk-section" data-kind="no-match">' +
            '<div class="bulk-section-title">❓ 매칭 안 됨 (<span class="bulk-section-count">' + data.no_match.length + '</span>명) — 눌러서 직접 선택</div>' +
            '<div class="bulk-section-rows">';
          data.no_match.forEach(function (raw) {
            html += '<div class="bulk-row no-match" data-raw="' + escapeHtml(raw) + '">' +
              '<span class="bulk-nomatch-trigger">' + escapeHtml(raw) + '</span>' +
              '<div class="bulk-sub">이 조 명단에서 이름/닉네임이 겹치는 사람을 못 찾았어요. 눌러서 직접 골라주세요.</div>' +
              '<div class="bulk-candidates bulk-roster-picker" hidden></div>' +
              '</div>';
          });
          html += '</div></div>';
        }
        if (data.ambiguous && data.ambiguous.length) {
          html += '<div class="bulk-section" data-kind="amb">' +
            '<div class="bulk-section-title">⚠️ 확인 필요 (<span class="bulk-section-count">' + data.ambiguous.length + '</span>건)</div>' +
            '<div class="bulk-section-rows">';
          data.ambiguous.forEach(function (amb) {
            html += '<div class="bulk-row amb" data-raw="' + escapeHtml(amb.raw) + '">"' + escapeHtml(amb.raw) + '" 님, 누구인가요?' +
              '<div class="bulk-candidates">' +
              amb.candidates.map(function (c) {
                return '<button type="button" class="bulk-cand-btn" data-member-id="' + c.member_id +
                  '" data-raw="' + escapeHtml(amb.raw) + '">' + escapeHtml(c.display) + '</button>';
              }).join('') +
              '</div></div>';
          });
          html += '</div></div>';
        }
        resultsEl.innerHTML = html;
        wireCandidateButtons();
        wireNoMatchTriggers();
      }

      runBtn.addEventListener('click', function () {
        var text = input.value.trim();
        if (!text) return;
        runBtn.disabled = true;
        fetch(BULK_MATCH_URL, {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text }),
        })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (!data.ok) {
              showToast(data.error || '매칭하지 못했어요.');
              return;
            }
            renderResults(data);
            var autoCount = (data.matched || []).length;
            var manualCount = (data.ambiguous || []).length + (data.no_match || []).length;
            showToast('자동매칭됨 ' + autoCount + '명 · 수동 매칭 필요 ' + manualCount + '명');
            input.value = '';
            loadRosterStatus();
          })
          .catch(function () {
            showToast('네트워크 오류로 매칭하지 못했어요.');
          })
          .finally(function () {
            runBtn.disabled = false;
          });
      });

      // ---------- 조원 매칭 현황판 ----------

      var rosterStatusLoaded = false;

      function loadRosterStatus() {
        // 처음 열렸을 때만 "불러오는 중…"으로 통째로 비운다. 한 명 매칭/수정
        // 후 다시 불러올 땐 기존 목록을 그대로 둔 채 데이터만 받아와서 새로
        // 그린다 — 매번 통째로 비웠다 채우면 목록 높이가 잠깐 줄어들면서
        // 스크롤이 맨 위로 튀어버리기 때문.
        if (!rosterStatusLoaded) {
          statusEl.innerHTML = '<p class="bulk-empty">불러오는 중…</p>';
        }
        fetch(ROSTER_STATUS_URL, { credentials: 'same-origin' })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (!data.ok) {
              if (!rosterStatusLoaded) {
                statusEl.innerHTML = '<p class="bulk-empty">' + escapeHtml(data.error || '불러오지 못했어요.') + '</p>';
              }
              return;
            }
            rosterStatusLoaded = true;
            renderRosterStatus(data.people || []);
          })
          .catch(function () {
            if (!rosterStatusLoaded) {
              statusEl.innerHTML = '<p class="bulk-empty">네트워크 오류로 불러오지 못했어요.</p>';
            }
          });
      }

      function statusRowHtml(p) {
        var autoTag = p.auto ? '<span class="auto-tag">자동</span>' : '';
        return '<div class="bulk-status-row" data-member-id="' + p.member_id + '">' +
          '<span class="nm">' + escapeHtml(p.display) + autoTag + '</span>' +
          '<div class="bulk-status-controls">' +
          '<input type="text" class="bulk-status-input" placeholder="카톡 이름" value="' +
          escapeHtml(p.matched_raw || '') + '">' +
          '<button type="button" class="bulk-status-save-btn" data-member-id="' + p.member_id + '">' +
          (p.matched_raw ? '수정' : '매칭') + '</button>' +
          '</div>' +
          '</div>';
      }

      function renderRosterStatus(people) {
        // 통째로 다시 그리면 (특히 매칭 안 된 사람 ↔ 매칭된 사람 사이에서
        // 행이 섹션을 넘나들 때) 문서 높이가 잠깐 바뀌면서 스크롤이 튈 수
        // 있어서, 다시 그리기 직전의 스크롤 위치를 기억해뒀다가 그린 다음
        // 그대로 복원한다.
        var scrollX = window.scrollX, scrollY = window.scrollY;

        // 매칭 안 된 사람을 먼저 보여줘야 그 사람들을 채워 넣기 편하다.
        var unmatched = people.filter(function (p) { return !p.matched_raw; });
        var matched = people.filter(function (p) { return p.matched_raw; });
        var html = '';
        if (unmatched.length) {
          html += '<div class="bulk-section-title">❓ 아직 매칭 안 됨 (' + unmatched.length + '명)</div>';
          unmatched.forEach(function (p) { html += statusRowHtml(p); });
        }
        if (matched.length) {
          html += '<div class="bulk-section-title">✅ 이미 매칭됨 (' + matched.length + '명)</div>';
          matched.forEach(function (p) { html += statusRowHtml(p); });
        }
        if (!html) html = '<p class="bulk-empty">조원 명단을 불러오지 못했어요.</p>';
        statusEl.innerHTML = html;
        wireRosterStatusButtons();

        window.scrollTo(scrollX, scrollY);
      }

      function wireRosterStatusButtons() {
        statusEl.querySelectorAll('.bulk-status-save-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var row = btn.closest('.bulk-status-row');
            var memberId = btn.getAttribute('data-member-id');
            var raw = row.querySelector('.bulk-status-input').value.trim();
            if (!raw) return;
            btn.disabled = true;
            fetch(BULK_RESOLVE_URL, {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ team: TEAM, member_id: memberId, raw: raw }),
            })
              .then(function (res) { return res.json(); })
              .then(function (d) {
                if (!d.ok) {
                  showToast(d.error || '매칭하지 못했어요.');
                  btn.disabled = false;
                  return;
                }
                showToast('매칭 완료' + fixedDatesSuffix(d.fixed_dates));
                loadRosterStatus();
              })
              .catch(function () {
                showToast('네트워크 오류로 저장하지 못했어요.');
                btn.disabled = false;
              });
          });
        });
        // 입력칸에서 엔터를 치면 같은 줄의 매칭/수정 버튼을 누른 것처럼 동작한다.
        statusEl.querySelectorAll('.bulk-status-input').forEach(function (input) {
          input.addEventListener('keydown', function (e) {
            if (e.key !== 'Enter') return;
            e.preventDefault();
            var row = input.closest('.bulk-status-row');
            var btn = row && row.querySelector('.bulk-status-save-btn');
            if (btn && !btn.disabled) btn.click();
          });
        });
      }

      loadRosterStatus();
    })();
  </script>
</body>
</html>
