<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2NCIgaGVpZ2h0PSI2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMwMDAwMDAiLz48dGV4dCB4PSIzMiIgeT0iNDYiIGZvbnQtZmFtaWx5PSItYXBwbGUtc3lzdGVtLEhlbHZldGljYSxBcmlhbCxzYW5zLXNlcmlmIiBmb250LXNpemU9IjM4IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjZmZmZmZmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5KPC90ZXh0Pjwvc3ZnPg==">
<title>업데이트 내역 작성 (관리자)</title>
<style>
  html{color-scheme:light}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
       max-width:560px;margin:40px auto;padding:0 20px;color:#222;background:#fff}
  h1{font-size:19px;margin:0 0 4px}
  h2.section-h2{font-size:15px;margin:28px 0 4px}
  p.hint{font-size:13px;color:#888;line-height:1.5;margin:8px 0 16px}
  p.hint a{color:#8a5a00}

  #changelog-content{width:100%;box-sizing:border-box;padding:10px;font-size:14px;
       border:1px solid #ddd;border-radius:8px;font-family:inherit;resize:vertical;
       background:#fff;color:#222;min-height:110px}
  .changelog-submit{margin-top:8px;border:none;border-radius:8px;background:#3C1E1E;color:#fff;
       font-weight:bold;font-size:14px;padding:10px 16px;cursor:pointer}

  .section-divider{border:none;border-top:1px solid #eee;margin:24px 0 14px}

  .changelog-list{margin-top:10px}
  .changelog-item{padding:12px 0;border-bottom:1px solid #f0f0f0}
  .changelog-item:last-child{border-bottom:none}
  .changelog-date{font-size:12px;color:#999;margin-bottom:4px}
  .changelog-content{font-size:14px;line-height:1.6;white-space:pre-line}
  .empty{font-size:13px;color:#888;margin-top:14px}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
       background:#222;color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:bold;
       box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
       z-index:50;max-width:88vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.error{background:#c0392b}
</style>
</head>
<body>
  <h1>📝 업데이트 내역 작성</h1>
  <p class="hint"><a href="{{ url_for('hamummal_upload_activity_log') }}">← 하멈말 사용 로그로 돌아가기</a></p>
  <p class="hint">여기 적으면 "오류제보 및 업데이트 내역" 페이지 아래쪽에 조장들에게 보여요.</p>

  <form method="post">
    <textarea id="changelog-content" name="content" placeholder="예: 10/21 — 이름 자동매칭이 틀리던 문제를 고쳤어요." required></textarea>
    <button type="submit" class="changelog-submit">업데이트 내역에 추가</button>
  </form>

  <hr class="section-divider">

  <h2 class="section-h2">지금까지 적은 내역</h2>
  {% if changelog %}
    <div class="changelog-list">
      {% for row in changelog %}
        <div class="changelog-item">
          <div class="changelog-date">{{ row.created_at[:10] }}</div>
          <div class="changelog-content">{{ row.content }}</div>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <p class="empty">아직 적은 내역이 없어요.</p>
  {% endif %}

  <div class="toast" id="toast"></div>

  <script>
    (function () {
      var messages = [
        {% for category, message in get_flashed_messages(with_categories=true) %}
          {text: {{ message|tojson }}, category: {{ category|tojson }}},
        {% endfor %}
      ];
      if (!messages.length) return;
      var toast = document.getElementById('toast');
      var i = 0;
      function showNext() {
        if (i >= messages.length) return;
        var m = messages[i++];
        toast.textContent = m.text;
        toast.className = 'toast show' + (m.category === 'success' ? '' : ' error');
        setTimeout(function () {
          toast.classList.remove('show');
          setTimeout(showNext, 300);
        }, 2600);
      }
      showNext();
    })();
  </script>
</body>
</html>
