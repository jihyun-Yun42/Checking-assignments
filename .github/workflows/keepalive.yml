name: keep-render-awake

on:
  schedule:
    # 5분마다, 정각 기준 오프셋을 줘서(2,7,12...) GitHub Actions가 정시(0분) 근처에
    # 몰릴 때 스케줄이 밀리는 걸 어느 정도 피한다. 어쩌다 한 번 밀리거나 스킵돼도
    # 다음 재시도가 5분 뒤라 Render의 15분 슬립 기준 안에 더 잘 들어온다.
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 비밀값으로 설정 파일 생성
        run: |
          cat > .env <<ENVEOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          TIMEZONE=Asia/Seoul
          ENVEOF

      - name: 진행 중인 기수인지 확인 (DB만 조회, Render는 안 건드림)
        id: cohort
        run: |
          RESULT=$(python -m src.cohort_status)
          echo "active=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Render 앱 깨워두기 (진행 중인 기수가 있을 때만)
        if: steps.cohort.outputs.active == 'true'
        run: curl -fsS "${{ secrets.RENDER_APP_URL }}/health" || true
