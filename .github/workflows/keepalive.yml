name: keep-render-awake

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (Render의 15분 슬립 기준보다 여유있게)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 비밀값으로 설정 파일 생성
        run: |
          mkdir -p config
          cat > .env <<ENVEOF
          GOOGLE_SERVICE_ACCOUNT_JSON=config/google_service_account.json
          GOOGLE_SHEET_NAME=${{ secrets.GOOGLE_SHEET_NAME }}
          TIMEZONE=Asia/Seoul
          ENVEOF
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > config/google_service_account.json

      - name: 진행 중인 기수인지 확인 (구글시트만 조회, Render는 안 건드림)
        id: cohort
        run: |
          RESULT=$(python -m src.cohort_status)
          echo "active=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Render 앱 깨워두기 (진행 중인 기수가 있을 때만)
        if: steps.cohort.outputs.active == 'true'
        run: curl -fsS "${{ secrets.RENDER_APP_URL }}/health" || true
