# Render.com 배포 설계도 (Blueprint).
# Render 대시보드 -> New -> Blueprint -> 이 저장소 선택하면 자동으로 읽힙니다.
services:
  - type: web
    name: sorituune-consent
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn webapp.app:app"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: UPLOAD_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: TIMEZONE
        value: Asia/Seoul
